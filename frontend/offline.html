<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ללא חיבור</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      text-align: center;
    }
    main {
      width: min(100%, 420px);
      background: #fff;
      border: 1px solid #e2e5ef;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      padding: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p {
      margin: 0;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>אין חיבור כרגע</h1>
    <p>אפשר להמשיך לעיין במסכים שכבר נפתחו קודם. כשהחיבור יחזור, רעננו את הדף.</p>
  </main>
</body>
</html>
