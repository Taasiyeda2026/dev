<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <meta name="robots" content="noindex,nofollow">
  <title>קישורים קצרים למשוב | תעשיידע</title>
  <style>
    :root{font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#172033;background:#f3f6f9;--primary:#17324d;--primary-dark:#10283d;--muted:#687386;--border:#d8e0e6;--danger:#b42318;--success:#18734b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6f9}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,calc(100% - 24px));padding:28px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 14px 36px rgba(15,23,42,.08)}
    .logo{display:block;width:auto;max-width:200px;height:66px;margin:0 auto 20px;object-fit:contain}.card h1{margin:0 0 7px;text-align:center;color:var(--primary);font-size:23px}.card p{margin:0 0 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
    .login-form{display:grid;gap:11px}.login-form label{display:grid;gap:6px;font-size:12px;font-weight:700}input[type=email],input[type=password],input[type=search]{min-height:40px;padding:8px 11px;border:1px solid #bcc8d1;border-radius:9px;outline:none;background:#fff;color:#172033}input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(23,50,77,.08)}
    .btn{min-height:38px;padding:8px 13px;border:1px solid var(--border);border-radius:9px;background:#fff;color:#263447;font-weight:700;font-size:12px}.btn:hover{background:#f7f9fb}.btn.primary{color:#fff;background:var(--primary);border-color:var(--primary)}.btn.primary:hover{background:var(--primary-dark)}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.5;cursor:not-allowed}
    .error{display:none;padding:9px 10px;color:#8b1e16;background:#fff2f0;border:1px solid #efb9b2;border-radius:9px;font-size:12px}.error.show{display:block}
    .shell{width:min(92vw,1120px);margin:0 auto;padding:18px 0 42px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;padding:12px 16px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 7px 22px rgba(15,23,42,.04)}.topbar .logo{height:58px;max-width:190px;margin:0;object-position:right center}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .heading{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 22px;color:#fff;background:var(--primary);border-radius:15px;box-shadow:0 12px 30px rgba(23,50,77,.15)}.heading h1{margin:0 0 5px;font-size:25px}.heading p{margin:0;color:#dce6ee;font-size:13px}.total{min-width:110px;padding:10px 14px;text-align:center;background:rgba(255,255,255,.1);border-radius:11px}.total strong{display:block;font-size:25px}.total span{font-size:11px}
    .notice{margin-top:10px;padding:12px 14px;color:#425268;background:#fff;border:1px solid var(--border);border-radius:11px;font-size:12px;line-height:1.6}.notice strong{color:var(--primary)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:10px;background:#fff;border:1px solid var(--border);border-radius:11px}.search{width:min(420px,48vw)}
    .panel{margin-top:9px;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:12px}.table-wrap{overflow-x:auto}table{width:100%;min-width:870px;border-collapse:collapse;table-layout:fixed;font-size:12px}th{padding:10px 9px;color:#4e5d70;background:#f4f7f9;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}td{height:48px;padding:8px 9px;border-bottom:1px solid #edf1f4;vertical-align:middle}tbody tr:hover{background:#fbfcfd}tbody tr:last-child td{border-bottom:0}.code{width:13%;direction:ltr;text-align:left;font-weight:800;color:var(--primary)}.authority{width:18%}.school{width:22%}.status{width:13%}.link{width:34%}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .badge{display:inline-flex;align-items:center;gap:5px;min-height:23px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.badge.ready{color:#315f86;background:#eaf2f8}.badge.opened{color:#765612;background:#fff4d5}.badge.draft{color:#8a6500;background:#fff0c2}.badge.submitted{color:var(--success);background:#e5f7ef}
    .link-row{display:flex;align-items:center;gap:6px}.url{min-width:0;flex:1;direction:ltr;text-align:left;color:#526174;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{padding:34px 18px;text-align:center;color:var(--muted)}
    .toast{position:fixed;right:50%;bottom:20px;z-index:90;transform:translate(50%,16px);padding:9px 13px;color:#fff;background:#172033;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 12px 30px rgba(15,23,42,.2);font-size:12px}.toast.show{opacity:1;transform:translate(50%,0)}.toast.error-toast{background:var(--danger)}
    @media(max-width:760px){.shell{width:calc(100% - 18px);padding-top:9px}.topbar{align-items:flex-start}.topbar .logo{height:49px;max-width:155px}.heading{padding:17px}.total{display:none}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.top-actions{justify-content:flex-end}.notice{font-size:11px}}
  </style>
</head>
<body>
  <div id="app" class="loading"><section class="card"><img class="logo" src="./logo.png" alt="תעשיידע"><p>טוען את הקישורים…</p></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/+esm';

    const supabase = createClient(
      'https://szinlhjuwyiyszdpsdop.supabase.co',
      'sb_publishable_k0IbDJlgPA9KTVuDWrCyFw_Zsa5kZIM',
      { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } }
    );
    const app=document.querySelector('#app');
    const toast=document.querySelector('#toast');
    const state={rows:[],filtered:[],search:'',busy:false};

    const esc=(value='')=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    function notify(message,isError=false){toast.textContent=message;toast.className=`toast show${isError?' error-toast':''}`;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.className='toast',2600)}
    function shortLink(row){if(!row.short_code)return'';return new URL(`./${row.short_code}/`,window.location.href).href}
    function statusOf(row){if(row.status==='submitted')return['submitted','הוגש'];if(row.status==='draft')return['draft','טיוטה'];if(row.first_opened_at)return['opened','נפתח'];return['ready','מוכן לשליחה']}

    async function init(){const {data}=await supabase.auth.getSession();if(!data?.session)return renderLogin();await enterAdmin()}
    function renderLogin(error=''){app.className='loading';app.innerHTML=`<section class="card"><img class="logo" src="./logo.png" alt="תעשיידע"><h1>קישורים קצרים למשוב</h1><p>כניסה למשתמשים מורשים</p><div class="error${error?' show':''}">${esc(error)}</div><form id="login-form" class="login-form"><label>דוא״ל<input name="email" type="email" autocomplete="username" required></label><label>סיסמה<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">כניסה</button></form></section>`}
    async function login(form){const button=form.querySelector('button');button.disabled=true;button.textContent='מתחבר…';const values=new FormData(form);const {data,error}=await supabase.auth.signInWithPassword({email:String(values.get('email')||'').trim(),password:String(values.get('password')||'')});if(error||!data?.session)return renderLogin('פרטי הכניסה אינם תקינים.');await enterAdmin()}
    async function enterAdmin(){const {data,error}=await supabase.rpc('educational_feedback_admin_access');if(error||data!==true){app.className='loading';app.innerHTML=`<section class="card"><img class="logo" src="./logo.png" alt="תעשיידע"><h1>אין הרשאת ניהול</h1><p>המשתמש המחובר אינו מורשה לצפות בקישורים.</p><button class="btn" data-action="logout">יציאה</button></section>`;return}await loadRows()}
    async function loadRows(){app.className='loading';app.innerHTML='<section class="card"><img class="logo" src="./logo.png" alt="תעשיידע"><p>טוען את הקישורים…</p></section>';const {data,error}=await supabase.from('educational_feedback').select('id,authority_name,school_name,short_code,access_token,status,first_opened_at').order('short_code');if(error){app.innerHTML=`<section class="card"><img class="logo" src="./logo.png" alt="תעשיידע"><h1>לא ניתן לטעון</h1><p>${esc(error.message||'אירעה תקלה זמנית.')}</p><button class="btn" data-action="reload">ניסיון נוסף</button></section>`;return}state.rows=data||[];applyFilter();render()}
    function applyFilter(){const q=state.search.trim().toLowerCase();state.filtered=state.rows.filter(row=>!q||`${row.short_code||''} ${row.authority_name} ${row.school_name}`.toLowerCase().includes(q))}
    function render(){app.className='';app.innerHTML=`<main class="shell"><header class="topbar"><img class="logo" src="./logo.png" alt="תעשיידע"><div class="top-actions"><button class="btn" data-action="main-admin">ניהול המשובים</button><button class="btn" data-action="export">ייצוא קישורים</button><button class="btn danger" data-action="logout">יציאה</button></div></header><section class="heading"><div><h1>קישורים קצרים למשוב</h1><p>קישורים ממוספרים ומוכנים לשליחה ב־WhatsApp</p></div><div class="total"><strong>${state.rows.length}</strong><span>קישורים</span></div></section><div class="notice"><strong>הקישור שמעתיקים מכאן הוא הקישור לשליחה.</strong> לכל קישור הוגדרה תצוגה מקדימה עם שם תעשיידע, תיאור ולוגו.</div><section class="toolbar"><input id="search" class="search" type="search" placeholder="חיפוש לפי קוד, רשות או בית ספר" value="${esc(state.search)}"><button class="btn primary" data-action="generate-all">השלמת קישורים חסרים</button></section><section class="panel">${tableHtml()}</section></main>`}
    function tableHtml(){if(!state.filtered.length)return'<div class="empty">לא נמצאו קישורים.</div>';return`<div class="table-wrap"><table><thead><tr><th class="code">קוד</th><th class="authority">רשות</th><th class="school">בית ספר</th><th class="status">סטטוס</th><th class="link">קישור לשליחה</th></tr></thead><tbody>${state.filtered.map(rowHtml).join('')}</tbody></table></div>`}
    function rowHtml(row){const [key,label]=statusOf(row);const url=shortLink(row);return`<tr><td class="code">${esc(row.short_code||'—')}</td><td class="truncate" title="${esc(row.authority_name)}">${esc(row.authority_name)}</td><td class="truncate" title="${esc(row.school_name)}"><strong>${esc(row.school_name)}</strong></td><td><span class="badge ${key}">${label}</span></td><td><div class="link-row"><span class="url" title="${esc(url)}">${esc(url)}</span><button class="btn primary" data-action="copy" data-id="${row.id}" ${url?'':'disabled'}>העתקה</button><button class="btn" data-action="open" data-id="${row.id}" ${url?'':'disabled'}>פתיחה</button></div></td></tr>`}
    async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const input=document.createElement('textarea');input.value=text;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();document.execCommand('copy');input.remove()}}
    async function copyLink(id){const row=state.rows.find(item=>item.id===id);const url=row?shortLink(row):'';if(!url)return;await copyText(url);notify('הקישור הקצר הועתק')}
    function openLink(id){const row=state.rows.find(item=>item.id===id);const url=row?shortLink(row):'';if(url)window.open(url,'_blank','noopener')}
    async function generateAll(){if(state.busy)return;state.busy=true;const {data,error}=await supabase.rpc('educational_feedback_generate_all_links');state.busy=false;if(error||!data?.ok)return notify(error?.message||'לא ניתן להשלים את הקישורים.',true);await loadRows();notify('הקישורים הושלמו')}
    function exportCsv(){const headers=['קוד','רשות','בית ספר','קישור'];const rows=state.rows.map(row=>[row.short_code,row.authority_name,row.school_name,shortLink(row)]);const quote=value=>`"${String(value??'').replaceAll('"','""')}"`;const csv='\uFEFF'+[headers,...rows].map(row=>row.map(quote).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='קישורים-קצרים-למשוב.csv';document.body.append(link);link.click();link.remove();URL.revokeObjectURL(url)}
    async function logout(){await supabase.auth.signOut();state.rows=[];renderLogin()}

    app.addEventListener('submit',event=>{if(event.target.id==='login-form'){event.preventDefault();login(event.target)}});
    app.addEventListener('input',event=>{if(event.target.id==='search'){state.search=event.target.value;applyFilter();render();const search=document.querySelector('#search');search?.focus();if(search)search.setSelectionRange(search.value.length,search.value.length)}});
    app.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;const id=button.dataset.id;if(action==='copy')copyLink(id);if(action==='open')openLink(id);if(action==='generate-all')generateAll();if(action==='export')exportCsv();if(action==='logout')logout();if(action==='reload')loadRows();if(action==='main-admin')window.location.href='./admin.html'});
    init();
  </script>
</body>
</html>
