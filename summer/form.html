<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex,nofollow">
  <title>משוב לצוות החינוכי | תעשיידע</title>
  <style>
    :root {
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      color: #182236;
      background: #f4f7fb;
      --primary: #0f766e;
      --primary-dark: #0b5f59;
      --primary-soft: #eaf8f5;
      --ink: #182236;
      --muted: #667085;
      --border: #dbe4ea;
      --danger: #b42318;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 118, 110, 0.1), transparent 28rem),
        linear-gradient(180deg, #edf8f6 0, #f4f7fb 270px);
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .loading-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .loading-card, .message-card {
      width: min(520px, 100%); padding: 30px; text-align: center; background: #fff;
      border: 1px solid var(--border); border-radius: 22px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }
    .spinner {
      width: 38px; height: 38px; margin: 0 auto 14px; border: 4px solid #d8ece8;
      border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-shell { width: min(920px, calc(100% - 28px)); margin: 0 auto; padding: 26px 0 56px; }
    .brand-bar { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 46px; height: 46px; display: grid; place-items: center; color: #fff;
      background: var(--primary); border-radius: 15px; font-size: 26px; font-weight: 800;
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.2);
    }
    .brand-copy strong { display: block; font-size: 20px; }
    .brand-copy span { color: var(--muted); font-size: 13px; }
    .save-status {
      min-height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px;
      border-radius: 999px; color: #475467; background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border); font-size: 13px; white-space: nowrap;
    }
    .save-status.saving::before, .save-status.saved::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--primary);
    }
    .hero {
      position: relative; overflow: hidden; padding: 30px; color: #fff;
      background: linear-gradient(135deg, #0f766e, #0b5f59 72%, #0b4c55);
      border-radius: 24px; box-shadow: 0 18px 46px rgba(15, 118, 110, 0.18);
    }
    .hero::after {
      content: ""; position: absolute; width: 260px; height: 260px; left: -110px; top: -130px;
      border: 42px solid rgba(255, 255, 255, 0.08); border-radius: 50%;
    }
    .hero h1 { position: relative; z-index: 1; margin: 0 0 10px; font-size: clamp(28px, 5vw, 42px); line-height: 1.15; }
    .hero p { position: relative; z-index: 1; max-width: 720px; margin: 0; color: #e7fffb; font-size: 16px; line-height: 1.65; }
    .school-card {
      position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 10px;
      margin-top: 20px; padding: 10px 14px; color: #0a4f4a; background: #fff;
      border-radius: 14px; font-weight: 700;
    }
    .school-card small { color: var(--muted); font-weight: 400; }
    .progress-card {
      margin-top: 16px; padding: 15px 17px; background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border); border-radius: 16px;
    }
    .progress-row { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 9px; color: #475467; font-size: 14px; }
    .progress-track { height: 8px; overflow: hidden; background: #e9eef2; border-radius: 999px; }
    .progress-track span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #16a394); border-radius: inherit; transition: width 0.25s ease; }
    .form-panel {
      margin-top: 16px; padding: 26px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 22px; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.055);
    }
    .section-head { margin-bottom: 22px; }
    .section-kicker { display: inline-block; margin-bottom: 6px; color: var(--primary); font-size: 13px; font-weight: 800; }
    .section-head h2 { margin: 0 0 7px; font-size: 26px; }
    .section-head p { margin: 0; color: var(--muted); line-height: 1.6; }
    .fields-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label, .field legend { font-weight: 700; }
    .required::after { content: " *"; color: var(--danger); }
    input[type="text"], textarea {
      width: 100%; padding: 12px 13px; color: var(--ink); background: #fff;
      border: 1px solid #bfcbd4; border-radius: 11px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    textarea { min-height: 112px; resize: vertical; line-height: 1.55; }
    input[type="text"]:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1); }
    .choice-grid, .highlight-grid, .future-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .choice-card, .highlight-card, .future-card {
      position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px;
      padding: 11px 13px; background: #fbfcfd; border: 1px solid var(--border);
      border-radius: 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .choice-card:hover, .highlight-card:hover, .future-card:hover { border-color: #9bbeb7; background: #f7fcfb; }
    .choice-card:has(input:checked), .highlight-card:has(input:checked), .future-card:has(input:checked) {
      border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.06);
    }
    .choice-card input, .highlight-card input, .future-card input { width: 18px; height: 18px; accent-color: var(--primary); }
    .question-list { display: grid; gap: 13px; }
    .rating-card { padding: 16px; background: #fbfcfd; border: 1px solid var(--border); border-radius: 15px; }
    .rating-title { margin: 0 0 13px; font-weight: 700; line-height: 1.55; }
    .rating-scale { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; }
    .rating-option {
      display: grid; place-items: center; min-height: 44px; padding: 6px; background: #fff;
      border: 1px solid #cbd5dc; border-radius: 10px; cursor: pointer; font-weight: 700; text-align: center;
    }
    .rating-option input { position: absolute; opacity: 0; pointer-events: none; }
    .rating-option:has(input:checked) { color: #fff; background: var(--primary); border-color: var(--primary); }
    .rating-option.na { font-size: 12px; font-weight: 600; }
    .scale-note { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .subsection { margin-top: 24px; padding-top: 22px; border-top: 1px solid #e7edf1; }
    .subsection h3 { margin: 0 0 6px; font-size: 19px; }
    .subsection p { margin: 0 0 13px; color: var(--muted); }
    .privacy-note {
      margin-top: 16px; padding: 11px 13px; color: #475467; background: #f8fafb;
      border: 1px solid #e4eaee; border-radius: 11px; font-size: 13px; line-height: 1.55;
    }
    .form-error {
      display: none; margin: 0 0 18px; padding: 11px 13px; color: #8a1c13;
      background: #fff3f1; border: 1px solid #f1b7b0; border-radius: 11px;
    }
    .form-error.show { display: block; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #e7edf1; }
    .actions-group { display: flex; gap: 10px; }
    .btn { min-height: 45px; padding: 10px 18px; border: 1px solid var(--border); border-radius: 11px; background: #fff; color: var(--ink); font-weight: 700; }
    .btn:hover { background: #f7f9fb; }
    .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .helper { color: var(--muted); font-size: 12px; }
    .other-role.hidden { display: none; }
    .thank-you { width: min(680px, calc(100% - 28px)); margin: 0 auto; padding: 64px 0; }
    .thank-you-card { padding: 42px 30px; text-align: center; background: #fff; border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 18px 46px rgba(15, 23, 42, 0.07); }
    .thank-you-icon { width: 70px; height: 70px; display: grid; place-items: center; margin: 0 auto 18px; color: #fff; background: var(--primary); border-radius: 50%; font-size: 34px; }
    .thank-you h1 { margin: 0 0 12px; }
    .thank-you p { max-width: 560px; margin: 0 auto; color: var(--muted); line-height: 1.7; }
    .toast {
      position: fixed; right: 50%; bottom: 24px; z-index: 50; transform: translate(50%, 20px);
      padding: 10px 15px; color: #fff; background: #172033; border-radius: 11px;
      opacity: 0; pointer-events: none; transition: 0.2s; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
    }
    .toast.show { opacity: 1; transform: translate(50%, 0); }
    .toast.error { background: var(--danger); }
    @media (max-width: 720px) {
      .page-shell { width: min(100% - 20px, 920px); padding-top: 14px; }
      .brand-bar { align-items: flex-start; }
      .brand-mark { width: 42px; height: 42px; }
      .brand-copy strong { font-size: 18px; }
      .save-status { font-size: 12px; }
      .hero { padding: 24px 20px; border-radius: 20px; }
      .form-panel { padding: 20px 16px; border-radius: 18px; }
      .fields-grid, .choice-grid, .highlight-grid, .future-grid { grid-template-columns: 1fr; }
      .rating-scale { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .rating-option.na { grid-column: span 3; }
      .actions { align-items: stretch; }
      .actions, .actions-group { flex-direction: column-reverse; }
      .btn { width: 100%; }
    }
    @media (max-width: 430px) {
      .brand-bar { flex-direction: column; }
      .save-status { align-self: flex-end; }
      .school-card { display: flex; width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="app" class="loading-screen" aria-live="polite">
    <div class="loading-card"><div class="spinner" aria-hidden="true"></div><p>טוען את המשוב…</p></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/+esm';
    const supabase = createClient(
      'https://szinlhjuwyiyszdpsdop.supabase.co',
      'sb_publishable_k0IbDJlgPA9KTVuDWrCyFw_Zsa5kZIM',
      { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
    );
    const app = document.querySelector('#app');
    const toast = document.querySelector('#toast');
    const params = new URLSearchParams(window.location.search);
    const token = (params.get('t') || params.get('token') || '').trim();
    const SATISFACTION = [
      ['coordination_info', 'התיאום והמידע שנמסרו לקראת הפעילויות היו ברורים, מסודרים ומדויקים.'],
      ['facilitation_professionalism', 'צוות ההדרכה הגיע ערוך והעביר את הפעילויות במקצועיות, בנעימות ובבהירות.'],
      ['age_group_fit', 'הפעילויות התאימו לגיל התלמידים, למאפייני הקבוצות ולמסגרת הקיץ.'],
      ['content_equipment_duration', 'התוכן, הציוד ומשך הפעילויות נתנו מענה מלא ומותאם לצורכי הקבוצות.'],
      ['learning_experience', 'הפעילויות העניקו לתלמידים חוויה לימודית, מעשית, מהנה ומשמעותית.'],
      ['expectations_staff', 'הפעילויות עמדו בציפיות שלנו ונתנו מענה מקצועי לצוות החינוכי.'],
      ['overall_satisfaction', 'באופן כללי, אנו שבעי רצון מפעילויות תעשיידע שהתקיימו בבית הספר.']
    ];
    const STUDENT_EXPERIENCE = [
      ['interest_curiosity', 'התלמידים גילו עניין, סקרנות ומעורבות לאורך הפעילויות.'],
      ['active_participation', 'התלמידים השתתפו באופן פעיל ושיתפו פעולה לאורך הפעילות.'],
      ['enjoyment_motivation', 'התלמידים הביעו הנאה, התלהבות ורצון להמשיך ולהתנסות.'],
      ['building_creation', 'התלמידים גילו מעורבות בבנייה, ביצירה ובשלבי ההתנסות.'],
      ['positive_experience', 'תגובות התלמידים העידו על חוויה חיובית, מהנה ומשמעותית.']
    ];
    const HIGHLIGHTS = [
      ['enthusiasm', 'התלהבות, הנאה ורצון להשתתף'],
      ['curiosity', 'סקרנות, עניין ושאלת שאלות'],
      ['active_participation', 'השתתפות פעילה לאורך הפעילות'],
      ['cooperation', 'שיתוף פעולה בין התלמידים'],
      ['pride', 'גאווה בתוצר, בבנייה או בהתנסות'],
      ['continue', 'רצון להמשיך בפעילות או להתנסות שוב'],
      ['after_talk', 'שיח על הפעילות גם לאחר סיומה'],
      ['different_interest', 'רמת עניין שונה בין התלמידים'],
      ['could_not_observe', 'לא הייתה אפשרות להתרשם']
    ];
    const STEPS = [
      ['פרטים כלליים', 'כמה פרטים קצרים על ממלא/ת המשוב'],
      ['שביעות רצון', 'התרשמות מהפעילויות ומההתנהלות'],
      ['חוויית התלמידים', 'מה שניכר בפועל במהלך הפעילויות'],
      ['סיכום קצר', 'מה חשוב לשמר ומה ניתן לשפר']
    ];
    const state = { data: null, step: 0, form: emptyForm(), saveTimer: null, saving: false, savedAt: null, error: '' };
    function emptyForm() {
      return {
        respondent_name: '', respondent_role: '', respondent_role_other: '',
        satisfaction_answers: {}, student_experience_answers: {}, student_highlights: [],
        preserve_text: '', improve_text: '', future_interest: '', memorable_response: ''
      };
    }
    function esc(value = '') {
      return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    const checked = (actual, expected) => actual === expected ? ' checked' : '';
    const selected = (list, value) => list.includes(value) ? ' checked' : '';
    function notify(message, isError = false) {
      toast.textContent = message;
      toast.className = `toast show${isError ? ' error' : ''}`;
      clearTimeout(notify.timer);
      notify.timer = setTimeout(() => { toast.className = 'toast'; }, 2800);
    }
    function serverError(error) {
      const raw = error?.message || 'לא ניתן לשמור את המשוב כעת.';
      const match = raw.match(/(?:ERROR|message)[:=]?\s*([^\n]+)/i);
      return (match?.[1] || raw).replace(/^PGRST\w+:\s*/i, '').trim();
    }
    function renderMessage(title, text) {
      app.className = 'loading-screen';
      app.innerHTML = `<section class="message-card"><div class="brand" style="justify-content:center;margin-bottom:18px"><span class="brand-mark">ת</span><span class="brand-copy"><strong>תעשיידע</strong><span>משוב לצוות החינוכי</span></span></div><h1>${esc(title)}</h1><p>${esc(text)}</p></section>`;
    }
    async function init() {
      if (token.length < 32) return renderMessage('הקישור אינו תקין', 'יש לפתוח את הקישור האישי שנשלח לבית הספר.');
      try {
        const { data, error } = await supabase.rpc('educational_feedback_get', { p_token: token });
        if (error) throw error;
        if (!data?.ok) return renderMessage('הקישור אינו תקין', 'הקישור אינו מזוהה או שאינו פעיל עוד.');
        state.data = data;
        if (data.response) {
          state.form = {
            ...emptyForm(), ...data.response,
            satisfaction_answers: data.response.satisfaction_answers || {},
            student_experience_answers: data.response.student_experience_answers || {},
            student_highlights: Array.isArray(data.response.student_highlights) ? data.response.student_highlights : []
          };
          state.savedAt = data.response.updated_at || null;
        }
        if (data.response?.status === 'submitted') return renderThankYou();
        if (!data.can_edit) return renderMessage('המשוב אינו פתוח כעת', 'מועד מילוי המשוב הסתיים. תודה על שיתוף הפעולה.');
        render();
      } catch (error) {
        console.error(error);
        renderMessage('לא ניתן לטעון את המשוב', 'אירעה תקלה זמנית. מומלץ לנסות לפתוח את הקישור שוב בעוד כמה דקות.');
      }
    }
    function saveStatusHtml() {
      if (state.saving) return '<span class="save-status saving">שומר…</span>';
      if (state.savedAt) return '<span class="save-status saved">הטיוטה נשמרה</span>';
      return '<span class="save-status">השמירה מתבצעת אוטומטית</span>';
    }
    function frame(content) {
      const { school_name: school, authority_name: authority } = state.data.recipient;
      const progress = ((state.step + 1) / STEPS.length) * 100;
      return `<main class="page-shell">
        <div class="brand-bar"><div class="brand"><span class="brand-mark">ת</span><span class="brand-copy"><strong>תעשיידע</strong><span>חינוך, תעשייה וחדשנות</span></span></div><div id="save-status">${saveStatusHtml()}</div></div>
        <section class="hero"><h1>משוב לצוות החינוכי</h1><p>תודה על שיתוף הפעולה ועל הזמנת פעילויות הקיץ של תעשיידע. ${esc(state.data.campaign.intro_text)}</p><div class="school-card"><span>${esc(school)}</span><small>${esc(authority)}</small></div></section>
        <section class="progress-card" aria-label="התקדמות במילוי המשוב"><div class="progress-row"><strong>${esc(STEPS[state.step][0])}</strong><span>שלב ${state.step + 1} מתוך ${STEPS.length}</span></div><div class="progress-track"><span style="width:${progress}%"></span></div></section>
        <section class="form-panel"><div id="form-error" class="form-error${state.error ? ' show' : ''}" role="alert">${esc(state.error)}</div>${content}${actionsHtml()}</section>
      </main>`;
    }
    function sectionHead(kicker, title, text) {
      return `<div class="section-head"><span class="section-kicker">${esc(kicker)}</span><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;
    }
    function actionsHtml() {
      const back = state.step > 0 ? '<button class="btn" type="button" data-action="back">חזרה</button>' : '<span class="helper">הקישור אישי ומותאם לבית הספר</span>';
      const primary = state.step === STEPS.length - 1 ? '<button class="btn primary" type="button" data-action="submit">שליחת המשוב</button>' : '<button class="btn primary" type="button" data-action="next">המשך</button>';
      return `<div class="actions"><div>${back}</div><div class="actions-group">${primary}</div></div>`;
    }
    function render() {
      state.error = '';
      const screens = [renderGeneral, renderSatisfaction, renderStudents, renderSummary];
      app.className = '';
      app.innerHTML = frame(screens[state.step]());
    }
    function renderGeneral() {
      const f = state.form;
      const otherClass = f.respondent_role === 'other' ? '' : ' hidden';
      return `${sectionHead('פרטים כלליים', 'נעים להכיר', 'שם בית הספר כבר זוהה באמצעות הקישור האישי. נותרו רק פרטי ממלא/ת המשוב.')}
        <div class="fields-grid">
          <div class="field full"><label class="required" for="respondent-name">שם מלא</label><input id="respondent-name" type="text" autocomplete="name" data-field="respondent_name" value="${esc(f.respondent_name)}" placeholder="שם פרטי ושם משפחה"></div>
          <fieldset class="field full" style="border:0;padding:0;margin:0"><legend class="required" style="margin-bottom:9px">תפקיד ממלא/ת המשוב</legend><div class="choice-grid">${roleChoice('manager', 'מנהל/ת')}${roleChoice('coordinator', 'רכז/ת')}${roleChoice('teacher', 'מורה או איש/אשת צוות חינוכי')}${roleChoice('other', 'אחר')}</div></fieldset>
          <div id="other-role" class="field full other-role${otherClass}"><label class="required" for="role-other">תפקיד אחר</label><input id="role-other" type="text" data-field="respondent_role_other" value="${esc(f.respondent_role_other)}" placeholder="נא לפרט"></div>
        </div><div class="privacy-note">הקישור אישי לבית הספר ואינו מציג את רשימת המוסדות האחרים. ניתן למלא חלק מהמשוב ולחזור להשלמתו מאותו קישור.</div>`;
    }
    function roleChoice(value, label) {
      return `<label class="choice-card"><input type="radio" name="respondent-role" data-field="respondent_role" value="${value}"${checked(state.form.respondent_role, value)}><span>${esc(label)}</span></label>`;
    }
    function renderSatisfaction() {
      return `${sectionHead('שביעות רצון מהפעילות', 'כיצד התרשמתם מהפעילויות?', 'יש לדרג את ההיגדים על סמך ההתרשמות מהפעילויות ומההתנהלות. 1 מציין מידה נמוכה מאוד ו־5 מציין מידה רבה מאוד.')}<div class="question-list">${SATISFACTION.map(([key, text], index) => ratingCard('satisfaction_answers', key, text, index + 1)).join('')}</div>`;
    }
    function renderStudents() {
      return `${sectionHead('התרשמות מחוויית התלמידים', 'מה ניכר בפועל במהלך הפעילויות?', 'השאלות מתייחסות להשתתפות התלמידים, להתנהגותם ולתגובותיהם במהלך הפעילויות.')}<div class="question-list">${STUDENT_EXPERIENCE.map(([key, text], index) => ratingCard('student_experience_answers', key, text, index + 1)).join('')}</div><div class="subsection"><h3>מה בלט במיוחד בתגובות התלמידים?</h3><p>ניתן לבחור יותר מתשובה אחת.</p><div class="highlight-grid">${HIGHLIGHTS.map(([value, label]) => `<label class="highlight-card"><input type="checkbox" data-highlight="${value}"${selected(state.form.student_highlights, value)}><span>${esc(label)}</span></label>`).join('')}</div></div>`;
    }
    function ratingCard(section, key, text, number) {
      const current = state.form[section]?.[key] || '';
      return `<article class="rating-card"><p class="rating-title">${number}. ${esc(text)}</p><div class="rating-scale" role="radiogroup" aria-label="${esc(text)}">${[1, 2, 3, 4, 5].map(value => `<label class="rating-option"><input type="radio" name="${section}-${key}" data-rating-section="${section}" data-rating-key="${key}" value="${value}"${checked(current, String(value))}><span>${value}</span></label>`).join('')}<label class="rating-option na"><input type="radio" name="${section}-${key}" data-rating-section="${section}" data-rating-key="${key}" value="na"${checked(current, 'na')}><span>לא ניתן להתרשם</span></label></div><div class="scale-note"><span>מידה נמוכה מאוד</span><span>מידה רבה מאוד</span></div></article>`;
    }
    function renderSummary() {
      const f = state.form;
      return `${sectionHead('סיכום קצר', 'עזרו לנו ללמוד ולהשתפר', 'התשובות יסייעו לנו לשמר את הדברים שעבדו היטב ולדייק את הפעילויות בהמשך.')}<div class="fields-grid">
        <div class="field full"><label class="required" for="preserve-text">מה עבד היטב בפעילויות וחשוב לשמר גם בהמשך?</label><textarea id="preserve-text" data-field="preserve_text" placeholder="אפשר להתייחס לתוכן, להדרכה, לציוד או לחוויית התלמידים">${esc(f.preserve_text)}</textarea></div>
        <div class="field full"><label class="required" for="improve-text">מה ניתן לשפר כדי לדייק ולהעשיר את הפעילויות?</label><textarea id="improve-text" data-field="improve_text" placeholder="כל הערה תסייע לנו להשתפר">${esc(f.improve_text)}</textarea></div>
        <fieldset class="field full" style="border:0;padding:0;margin:0"><legend class="required" style="margin-bottom:9px">האם הייתם מעוניינים בפעילות נוספת של תעשיידע בעתיד?</legend><div class="future-grid">${futureChoice('yes', 'כן')}${futureChoice('maybe', 'ייתכן, נשמח לקבל פרטים')}${futureChoice('no', 'לא בשלב זה')}</div></fieldset>
        <div class="field full"><label for="memorable-response">האם זכורה לכם תגובה, התנהגות או אמירה של תלמידים בעקבות הפעילויות?</label><textarea id="memorable-response" data-field="memorable_response" placeholder="שדה רשות">${esc(f.memorable_response)}</textarea></div>
      </div>`;
    }
    function futureChoice(value, label) {
      return `<label class="future-card"><input type="radio" name="future-interest" data-field="future_interest" value="${value}"${checked(state.form.future_interest, value)}><span>${esc(label)}</span></label>`;
    }
    function setError(message) {
      state.error = message;
      const box = document.querySelector('#form-error');
      if (box) { box.textContent = message; box.classList.add('show'); box.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
    function clearError() {
      state.error = '';
      const box = document.querySelector('#form-error');
      if (box) { box.textContent = ''; box.classList.remove('show'); }
    }
    function validateStep(step) {
      const f = state.form;
      if (step === 0) {
        if (f.respondent_name.trim().length < 2) return 'יש למלא שם מלא.';
        if (!f.respondent_role) return 'יש לבחור את תפקיד ממלא/ת המשוב.';
        if (f.respondent_role === 'other' && f.respondent_role_other.trim().length < 2) return 'יש לפרט את התפקיד.';
      }
      if (step === 1 && SATISFACTION.some(([key]) => !f.satisfaction_answers[key])) return 'יש להשלים את כל היגדי שביעות הרצון.';
      if (step === 2) {
        if (STUDENT_EXPERIENCE.some(([key]) => !f.student_experience_answers[key])) return 'יש להשלים את כל היגדי חוויית התלמידים.';
        if (!f.student_highlights.length) return 'יש לבחור לפחות תגובה אחת שבלטה אצל התלמידים.';
      }
      if (step === 3) {
        if (f.preserve_text.trim().length < 3) return 'יש לציין מה חשוב לשמר.';
        if (f.improve_text.trim().length < 3) return 'יש לציין מה ניתן לשפר.';
        if (!f.future_interest) return 'יש לבחור האם תהיו מעוניינים בפעילות נוספת.';
      }
      return '';
    }
    function scheduleSave() {
      if (!state.data?.can_edit || state.saving) return;
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(() => save(false, true), 850);
    }
    function updateSaveStatus() {
      const holder = document.querySelector('#save-status');
      if (holder) holder.innerHTML = saveStatusHtml();
    }
    async function save(submit = false, silent = false) {
      if (state.saving) return false;
      clearTimeout(state.saveTimer);
      state.saving = true;
      updateSaveStatus();
      try {
        const { data, error } = await supabase.rpc('educational_feedback_save', { p_token: token, p_payload: state.form, p_submit: submit });
        if (error) throw error;
        state.savedAt = data?.saved_at || new Date().toISOString();
        if (!silent && !submit) notify('הטיוטה נשמרה');
        if (submit) renderThankYou();
        return true;
      } catch (error) {
        console.error(error);
        const message = serverError(error);
        if (submit) setError(message); else notify(message, true);
        return false;
      } finally {
        state.saving = false;
        updateSaveStatus();
      }
    }
    async function goNext() {
      clearError();
      const error = validateStep(state.step);
      if (error) return setError(error);
      const saved = await save(false, true);
      if (!saved) return;
      if (state.step < STEPS.length - 1) { state.step += 1; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    }
    function goBack() {
      clearTimeout(state.saveTimer);
      save(false, true);
      if (state.step > 0) { state.step -= 1; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    }
    async function submitFeedback() {
      clearError();
      const error = validateStep(3);
      if (error) return setError(error);
      const button = document.querySelector('[data-action="submit"]');
      if (button) { button.disabled = true; button.textContent = 'שולח…'; }
      const ok = await save(true, true);
      if (!ok && button) { button.disabled = false; button.textContent = 'שליחת המשוב'; }
    }
    function renderThankYou() {
      clearTimeout(state.saveTimer);
      app.className = '';
      app.innerHTML = `<main class="thank-you"><section class="thank-you-card"><div class="thank-you-icon">✓</div><div class="brand" style="justify-content:center;margin-bottom:22px"><span class="brand-mark">ת</span><span class="brand-copy"><strong>תעשיידע</strong><span>פעילויות הקיץ</span></span></div><h1>תודה רבה על הזמן ועל שיתוף הפעולה</h1><p>המשוב התקבל בהצלחה. חוות דעתכם תסייע לנו לשמר את הדברים שעבדו היטב, לדייק את הפעילויות ולהמשיך להעניק לתלמידים חוויות לימודיות, מעשיות ומהנות.</p></section></main>`;
    }
    app.addEventListener('input', event => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)) return;
      if (target.dataset.field) {
        state.form[target.dataset.field] = target.value;
        if (target.dataset.field === 'respondent_role') {
          document.querySelector('#other-role')?.classList.toggle('hidden', target.value !== 'other');
          if (target.value !== 'other') state.form.respondent_role_other = '';
        }
      }
      if (target.dataset.ratingSection && target.dataset.ratingKey) state.form[target.dataset.ratingSection][target.dataset.ratingKey] = target.value;
      if (target.dataset.highlight) {
        const value = target.dataset.highlight;
        let set = new Set(state.form.student_highlights);
        if (target.checked) {
          if (value === 'could_not_observe') set = new Set(['could_not_observe']);
          else { set.delete('could_not_observe'); set.add(value); }
        } else set.delete(value);
        state.form.student_highlights = [...set];
        document.querySelectorAll('[data-highlight]').forEach(box => { box.checked = set.has(box.dataset.highlight); });
      }
      clearError();
      scheduleSave();
    });
    app.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      if (button.dataset.action === 'next') goNext();
      if (button.dataset.action === 'back') goBack();
      if (button.dataset.action === 'submit') submitFeedback();
    });
    init();
  </script>
</body>
</html>
