<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <meta name="robots" content="noindex,nofollow">
  <title>משוב לצוות החינוכי | תעשיידע</title>
  <style>
    :root {
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      color: #172033;
      background: #f3f6f9;
      --primary: #17324d;
      --primary-dark: #10283d;
      --primary-soft: #eef3f7;
      --ink: #172033;
      --muted: #687386;
      --border: #d8e0e6;
      --danger: #b42318;
      --panel: #fff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: #f3f6f9; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .loading-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .loading-card, .message-card {
      width: min(460px, calc(100% - 24px));
      padding: 28px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 14px 36px rgba(15,23,42,.07);
    }
    .message-logo { display: block; width: auto; max-width: 190px; height: 62px; margin: 0 auto 18px; object-fit: contain; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 12px;
      border: 4px solid #dbe3e9; border-top-color: var(--primary);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .page-shell {
      width: min(82vw, 860px);
      margin: 0 auto;
      padding: 22px 0 48px;
    }
    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .brand-logo {
      display: block;
      width: auto;
      max-width: 190px;
      height: 60px;
      object-fit: contain;
      object-position: right center;
    }
    .save-status {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      color: #5c6778;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .save-status:empty { display: none; }
    .save-status.saving::before, .save-status.saved::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary);
    }

    .intro-card {
      padding: 22px 24px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(15,23,42,.05);
    }
    .intro-card h1 { margin: 0 0 7px; color: var(--primary); font-size: 28px; line-height: 1.2; }
    .intro-card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .school-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 14px;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid #edf1f4;
      font-size: 14px;
    }
    .school-line strong { color: var(--ink); }
    .school-line span { color: var(--muted); }

    .progress-card {
      margin-top: 10px;
      padding: 11px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: #536174;
      font-size: 12px;
    }
    .progress-track { height: 5px; overflow: hidden; background: #e7edf1; border-radius: 999px; }
    .progress-track span { display: block; height: 100%; background: var(--primary); border-radius: inherit; transition: width .2s ease; }

    .form-panel {
      margin-top: 10px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(15,23,42,.045);
    }
    .section-head { margin-bottom: 20px; }
    .section-head h2 { margin: 0; color: var(--ink); font-size: 24px; }
    .section-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .fields-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label, .field legend { font-size: 14px; font-weight: 700; }
    .required::after { content: " *"; color: var(--danger); }
    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }

    input[type="text"], textarea {
      width: 100%;
      padding: 11px 12px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #bcc8d1;
      border-radius: 9px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea { min-height: 105px; resize: vertical; line-height: 1.55; }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23,50,77,.09);
    }

    .choice-grid, .highlight-grid, .future-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 9px;
    }
    .choice-card, .highlight-card, .future-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 46px;
      padding: 10px 12px;
      background: #fbfcfd;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .choice-card:hover, .highlight-card:hover, .future-card:hover { border-color: #9baab6; }
    .choice-card:has(input:checked), .highlight-card:has(input:checked), .future-card:has(input:checked) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .choice-card input, .highlight-card input, .future-card input {
      width: 17px; height: 17px; accent-color: var(--primary);
    }

    .question-list { display: grid; gap: 11px; }
    .rating-card {
      padding: 14px;
      background: #fbfcfd;
      border: 1px solid var(--border);
      border-radius: 11px;
    }
    .rating-title { margin: 0 0 11px; font-size: 14px; font-weight: 700; line-height: 1.5; }
    .rating-scale { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 6px; }
    .rating-option {
      display: grid;
      place-items: center;
      min-height: 40px;
      padding: 5px;
      background: #fff;
      border: 1px solid #c8d1d8;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .rating-option input { position: absolute; opacity: 0; pointer-events: none; }
    .rating-option:has(input:checked) { color: #fff; background: var(--primary); border-color: var(--primary); }
    .rating-option.na { font-size: 11px; font-weight: 600; }
    .scale-note { display: flex; justify-content: space-between; gap: 12px; margin-top: 7px; color: var(--muted); font-size: 11px; }

    .subsection { margin-top: 20px; padding-top: 18px; border-top: 1px solid #e8edf1; }
    .subsection h3 { margin: 0 0 9px; font-size: 17px; }

    .form-error {
      display: none;
      margin: 0 0 16px;
      padding: 10px 12px;
      color: #8a1c13;
      background: #fff3f1;
      border: 1px solid #f1b7b0;
      border-radius: 9px;
      font-size: 13px;
    }
    .form-error.show { display: block; }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e8edf1;
    }
    .actions-group { display: flex; gap: 9px; }
    .btn {
      min-height: 42px;
      padding: 9px 17px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-weight: 700;
    }
    .btn:hover { background: #f7f9fb; }
    .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .thank-you { width: min(82vw, 620px); margin: 0 auto; padding: 46px 0; }
    .thank-you-card {
      padding: 38px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 14px 36px rgba(15,23,42,.07);
    }
    .thank-you-logo { display: block; width: auto; max-width: 190px; height: 62px; margin: 0 auto 18px; object-fit: contain; }
    .thank-you-icon {
      width: 58px; height: 58px;
      display: grid; place-items: center;
      margin: 0 auto 16px;
      color: #fff; background: var(--primary);
      border-radius: 50%; font-size: 27px;
    }
    .thank-you h1 { margin: 0 0 10px; color: var(--primary); }
    .thank-you p { margin: 0; color: var(--muted); line-height: 1.65; }

    .toast {
      position: fixed;
      right: 50%; bottom: 20px; z-index: 50;
      transform: translate(50%,16px);
      padding: 9px 13px;
      color: #fff; background: #172033;
      border-radius: 9px;
      opacity: 0; pointer-events: none;
      transition: .2s;
      box-shadow: 0 12px 30px rgba(15,23,42,.18);
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translate(50%,0); }
    .toast.error { background: var(--danger); }

    @media (max-width: 760px) {
      .page-shell { width: calc(100% - 20px); padding-top: 12px; }
      .brand-logo { height: 52px; max-width: 165px; }
      .intro-card { padding: 19px 17px; }
      .intro-card h1 { font-size: 24px; }
      .form-panel { padding: 20px 16px; }
      .fields-grid, .choice-grid, .highlight-grid, .future-grid { grid-template-columns: 1fr; }
      .rating-scale { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .rating-option.na { grid-column: span 3; }
    }
    @media (max-width: 460px) {
      .brand-bar { align-items: flex-start; }
      .save-status { margin-top: 8px; font-size: 11px; }
      .actions { align-items: stretch; flex-direction: column-reverse; }
      .actions-group { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="app" class="loading-screen" aria-live="polite">
    <div class="loading-card"><div class="spinner" aria-hidden="true"></div><p>טוען את המשוב…</p></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/+esm';

    const supabase = createClient(
      'https://szinlhjuwyiyszdpsdop.supabase.co',
      'sb_publishable_k0IbDJlgPA9KTVuDWrCyFw_Zsa5kZIM',
      { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
    );

    const app = document.querySelector('#app');
    const toast = document.querySelector('#toast');
    const params = new URLSearchParams(window.location.search);
    const token = (params.get('t') || params.get('token') || '').trim();

    const SATISFACTION = [
      ['coordination_info', 'התיאום והמידע שנמסרו לקראת הפעילויות היו ברורים, מסודרים ומדויקים.'],
      ['facilitation_professionalism', 'צוות ההדרכה הגיע ערוך והעביר את הפעילויות במקצועיות, בנעימות ובבהירות.'],
      ['age_group_fit', 'הפעילויות התאימו לגיל התלמידים, למאפייני הקבוצות ולמסגרת הקיץ.'],
      ['content_equipment_duration', 'התוכן, הציוד ומשך הפעילויות נתנו מענה מלא ומותאם לצורכי הקבוצות.'],
      ['learning_experience', 'הפעילויות העניקו לתלמידים חוויה לימודית, מעשית, מהנה ומשמעותית.'],
      ['expectations_staff', 'הפעילויות עמדו בציפיות שלנו ונתנו מענה מקצועי לצוות החינוכי.'],
      ['overall_satisfaction', 'באופן כללי, אנו שבעי רצון מפעילויות תעשיידע שהתקיימו בבית הספר.']
    ];
    const STUDENT_EXPERIENCE = [
      ['interest_curiosity', 'התלמידים גילו עניין, סקרנות ומעורבות לאורך הפעילויות.'],
      ['active_participation', 'התלמידים השתתפו באופן פעיל ושיתפו פעולה לאורך הפעילות.'],
      ['enjoyment_motivation', 'התלמידים הביעו הנאה, התלהבות ורצון להמשיך ולהתנסות.'],
      ['building_creation', 'התלמידים גילו מעורבות בבנייה, ביצירה ובשלבי ההתנסות.'],
      ['positive_experience', 'תגובות התלמידים העידו על חוויה חיובית, מהנה ומשמעותית.']
    ];
    const HIGHLIGHTS = [
      ['enthusiasm', 'התלהבות והנאה'],
      ['curiosity', 'סקרנות ושאלת שאלות'],
      ['active_participation', 'השתתפות פעילה'],
      ['cooperation', 'שיתוף פעולה בין התלמידים'],
      ['pride', 'גאווה בתוצר, בבנייה או בהתנסות'],
      ['continue', 'רצון להמשיך או להתנסות שוב'],
      ['after_talk', 'שיח על הפעילות לאחר סיומה'],
      ['different_interest', 'רמת העניין הייתה שונה בין התלמידים'],
      ['could_not_observe', 'לא הייתה אפשרות להתרשם']
    ];
    const STEPS = ['פרטים כלליים', 'שביעות רצון', 'חוויית התלמידים', 'סיכום קצר'];

    const state = {
      data: null,
      step: 0,
      form: emptyForm(),
      saveTimer: null,
      saving: false,
      savedAt: null,
      error: ''
    };

    function emptyForm() {
      return {
        respondent_name: '',
        respondent_role: '',
        respondent_role_other: '',
        satisfaction_answers: {},
        student_experience_answers: {},
        student_highlights: [],
        preserve_text: '',
        improve_text: '',
        future_interest: '',
        memorable_response: ''
      };
    }

    function esc(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    const checked = (actual, expected) => actual === expected ? ' checked' : '';
    const selected = (list, value) => list.includes(value) ? ' checked' : '';

    function notify(message, isError = false) {
      toast.textContent = message;
      toast.className = `toast show${isError ? ' error' : ''}`;
      clearTimeout(notify.timer);
      notify.timer = setTimeout(() => { toast.className = 'toast'; }, 2500);
    }

    function serverError(error) {
      return String(error?.message || 'לא ניתן לשמור את המשוב כעת.')
        .replace(/^PGRST\w+:\s*/i, '')
        .trim();
    }

    function renderMessage(title, text) {
      app.className = 'loading-screen';
      app.innerHTML = `<section class="message-card">
        <img class="message-logo" src="./logo.png" alt="תעשיידע">
        <h1>${esc(title)}</h1>
        <p>${esc(text)}</p>
      </section>`;
    }

    async function init() {
      if (token.length < 32) {
        renderMessage('הקישור אינו תקין', 'יש לפתוח את הקישור שנשלח לבית הספר.');
        return;
      }
      try {
        const { data, error } = await supabase.rpc('educational_feedback_get', { p_token: token });
        if (error) throw error;
        if (!data?.ok) {
          renderMessage('הקישור אינו תקין', 'הקישור אינו מזוהה או שאינו פעיל.');
          return;
        }
        state.data = data;
        if (data.response) {
          state.form = {
            ...emptyForm(),
            ...data.response,
            satisfaction_answers: data.response.satisfaction_answers || {},
            student_experience_answers: data.response.student_experience_answers || {},
            student_highlights: Array.isArray(data.response.student_highlights) ? data.response.student_highlights : []
          };
          state.savedAt = data.response.updated_at || null;
        }
        if (data.response?.status === 'submitted') {
          renderThankYou();
          return;
        }
        if (!data.can_edit) {
          renderMessage('המשוב אינו פתוח כעת', 'תודה על שיתוף הפעולה.');
          return;
        }
        render();
      } catch (error) {
        console.error(error);
        renderMessage('לא ניתן לטעון את המשוב', 'אירעה תקלה זמנית. מומלץ לנסות שוב בעוד כמה דקות.');
      }
    }

    function saveStatusHtml() {
      if (state.saving) return '<span class="save-status saving">שומר…</span>';
      if (state.savedAt) return '<span class="save-status saved">נשמר</span>';
      return '<span class="save-status"></span>';
    }

    function frame(content) {
      const { school_name: school, authority_name: authority } = state.data.recipient;
      const progress = ((state.step + 1) / STEPS.length) * 100;
      return `<main class="page-shell">
        <div class="brand-bar">
          <img class="brand-logo" src="./logo.png" alt="תעשיידע">
          <div id="save-status">${saveStatusHtml()}</div>
        </div>
        <section class="intro-card">
          <h1>משוב לצוות החינוכי</h1>
          <p>נודה למילוי משוב קצר על פעילות תעשיידע בבית הספר.</p>
          <div class="school-line"><strong>${esc(school)}</strong><span>${esc(authority)}</span></div>
        </section>
        <section class="progress-card" aria-label="התקדמות במילוי המשוב">
          <div class="progress-row"><strong>${esc(STEPS[state.step])}</strong><span>שלב ${state.step + 1} מתוך ${STEPS.length}</span></div>
          <div class="progress-track"><span style="width:${progress}%"></span></div>
        </section>
        <section class="form-panel">
          <div id="form-error" class="form-error${state.error ? ' show' : ''}" role="alert">${esc(state.error)}</div>
          ${content}
          ${actionsHtml()}
        </section>
      </main>`;
    }

    function sectionHead(title, text = '') {
      return `<div class="section-head"><h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}</div>`;
    }

    function actionsHtml() {
      const back = state.step > 0 ? '<button class="btn" type="button" data-action="back">חזרה</button>' : '<span></span>';
      const primary = state.step === STEPS.length - 1
        ? '<button class="btn primary" type="button" data-action="submit">שליחת המשוב</button>'
        : '<button class="btn primary" type="button" data-action="next">המשך</button>';
      return `<div class="actions"><div>${back}</div><div class="actions-group">${primary}</div></div>`;
    }

    function render() {
      state.error = '';
      const screens = [renderGeneral, renderSatisfaction, renderStudents, renderSummary];
      app.className = '';
      app.innerHTML = frame(screens[state.step]());
    }

    function renderGeneral() {
      const f = state.form;
      return `${sectionHead('פרטי ממלא/ת המשוב')}
        <div class="fields-grid">
          <div class="field full">
            <label class="required" for="respondent-name">שם מלא</label>
            <input id="respondent-name" type="text" data-field="respondent_name" value="${esc(f.respondent_name)}" autocomplete="name">
          </div>
          <fieldset class="field full">
            <legend class="required">תפקיד</legend>
            <div class="choice-grid">
              ${roleOption('manager', 'מנהל/ת')}
              ${roleOption('coordinator', 'רכז/ת')}
              ${roleOption('teacher', 'מורה או איש/אשת צוות חינוכי')}
              ${roleOption('other', 'אחר')}
            </div>
          </fieldset>
          ${f.respondent_role === 'other' ? `<div class="field full"><label class="required" for="role-other">פירוט התפקיד</label><input id="role-other" type="text" data-field="respondent_role_other" value="${esc(f.respondent_role_other)}"></div>` : ''}
        </div>`;
    }

    function roleOption(value, label) {
      return `<label class="choice-card"><input type="radio" name="respondent-role" data-field="respondent_role" value="${value}"${checked(state.form.respondent_role, value)}><span>${esc(label)}</span></label>`;
    }

    function renderSatisfaction() {
      return `${sectionHead('שביעות רצון מהפעילות', 'יש לדרג כל היגד בסולם של 1–5.')}
        <div class="question-list">${SATISFACTION.map(([key, label]) => ratingQuestion('satisfaction_answers', key, label)).join('')}</div>`;
    }

    function renderStudents() {
      return `${sectionHead('חוויית התלמידים', 'יש לדרג כל היגד לפי ההתרשמות במהלך הפעילות.')}
        <div class="question-list">${STUDENT_EXPERIENCE.map(([key, label]) => ratingQuestion('student_experience_answers', key, label)).join('')}</div>
        <section class="subsection">
          <h3>מה בלט במיוחד בתגובות התלמידים?</h3>
          <div class="highlight-grid">${HIGHLIGHTS.map(([value, label]) => `<label class="highlight-card"><input type="checkbox" data-highlight="${value}"${selected(state.form.student_highlights, value)}><span>${esc(label)}</span></label>`).join('')}</div>
        </section>`;
    }

    function ratingQuestion(group, key, label) {
      const value = state.form[group][key] || '';
      const options = ['1','2','3','4','5'].map(number => `<label class="rating-option"><input type="radio" name="${group}-${key}" data-rating-group="${group}" data-rating-key="${key}" value="${number}"${checked(value, number)}><span>${number}</span></label>`).join('');
      return `<article class="rating-card">
        <p class="rating-title">${esc(label)}</p>
        <div class="rating-scale">${options}<label class="rating-option na"><input type="radio" name="${group}-${key}" data-rating-group="${group}" data-rating-key="${key}" value="na"${checked(value, 'na')}><span>לא ניתן להתרשם</span></label></div>
        <div class="scale-note"><span>1 – כלל לא</span><span>5 – במידה רבה מאוד</span></div>
      </article>`;
    }

    function renderSummary() {
      const f = state.form;
      return `${sectionHead('סיכום קצר')}
        <div class="fields-grid">
          <div class="field full"><label class="required" for="preserve">מה בפעילויות עבד היטב וחשוב לשמר?</label><textarea id="preserve" data-field="preserve_text">${esc(f.preserve_text)}</textarea></div>
          <div class="field full"><label class="required" for="improve">מה יכול להפוך את הפעילויות לטובות ומדויקות עוד יותר?</label><textarea id="improve" data-field="improve_text">${esc(f.improve_text)}</textarea></div>
          <fieldset class="field full">
            <legend class="required">האם הייתם מעוניינים לקיים בעתיד פעילות נוספת של תעשיידע?</legend>
            <div class="future-grid">
              ${futureOption('yes', 'כן')}
              ${futureOption('maybe', 'ייתכן, נשמח לקבל פרטים')}
              ${futureOption('no', 'לא בשלב זה')}
            </div>
          </fieldset>
          <div class="field full"><label for="memorable">האם זכורה לכם תגובה, התנהגות או אמירה של תלמידים בעקבות הפעילויות?</label><textarea id="memorable" data-field="memorable_response">${esc(f.memorable_response)}</textarea></div>
        </div>`;
    }

    function futureOption(value, label) {
      return `<label class="future-card"><input type="radio" name="future-interest" data-field="future_interest" value="${value}"${checked(state.form.future_interest, value)}><span>${esc(label)}</span></label>`;
    }

    function updateFormFromElement(element) {
      const field = element.dataset.field;
      if (field) state.form[field] = element.value;

      const group = element.dataset.ratingGroup;
      const key = element.dataset.ratingKey;
      if (group && key) state.form[group][key] = element.value;

      const highlight = element.dataset.highlight;
      if (highlight) {
        if (highlight === 'could_not_observe' && element.checked) {
          state.form.student_highlights = ['could_not_observe'];
        } else {
          const set = new Set(state.form.student_highlights.filter(item => item !== 'could_not_observe'));
          if (element.checked) set.add(highlight); else set.delete(highlight);
          state.form.student_highlights = [...set];
        }
      }
    }

    function scheduleSave() {
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(() => save(false, true), 700);
    }

    function validateStep(step = state.step) {
      const f = state.form;
      if (step === 0) {
        if (f.respondent_name.trim().length < 2) return 'יש למלא שם מלא.';
        if (!f.respondent_role) return 'יש לבחור תפקיד.';
        if (f.respondent_role === 'other' && f.respondent_role_other.trim().length < 2) return 'יש לפרט את התפקיד.';
      }
      if (step === 1 && SATISFACTION.some(([key]) => !f.satisfaction_answers[key])) return 'יש להשלים את כל הדירוגים.';
      if (step === 2) {
        if (STUDENT_EXPERIENCE.some(([key]) => !f.student_experience_answers[key])) return 'יש להשלים את כל הדירוגים.';
        if (!f.student_highlights.length) return 'יש לבחור לפחות תשובה אחת.';
      }
      if (step === 3) {
        if (f.preserve_text.trim().length < 3) return 'יש לציין מה חשוב לשמר.';
        if (f.improve_text.trim().length < 3) return 'יש לציין מה ניתן לשפר.';
        if (!f.future_interest) return 'יש לבחור תשובה לגבי פעילות נוספת.';
      }
      return '';
    }

    function validateAll() {
      for (let step = 0; step < STEPS.length; step += 1) {
        const error = validateStep(step);
        if (error) return { step, error };
      }
      return null;
    }

    async function save(submit = false, silent = false) {
      if (state.saving) return false;
      clearTimeout(state.saveTimer);
      state.saving = true;
      updateSaveStatus();
      try {
        const { data, error } = await supabase.rpc('educational_feedback_save', {
          p_token: token,
          p_payload: state.form,
          p_submit: submit
        });
        if (error) throw error;
        state.savedAt = data?.saved_at || new Date().toISOString();
        state.saving = false;
        updateSaveStatus();
        if (!silent && !submit) notify('המשוב נשמר');
        return true;
      } catch (error) {
        console.error(error);
        state.saving = false;
        updateSaveStatus();
        if (!silent) notify(serverError(error), true);
        return false;
      }
    }

    function updateSaveStatus() {
      const container = document.querySelector('#save-status');
      if (container) container.innerHTML = saveStatusHtml();
    }

    async function nextStep() {
      const error = validateStep();
      if (error) {
        state.error = error;
        render();
        document.querySelector('#form-error')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      const saved = await save(false, true);
      if (!saved) {
        state.error = 'לא ניתן לשמור את המשוב כעת.';
        render();
        return;
      }
      state.step += 1;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function submitFeedback() {
      const invalid = validateAll();
      if (invalid) {
        state.step = invalid.step;
        state.error = invalid.error;
        render();
        document.querySelector('#form-error')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      const button = document.querySelector('[data-action="submit"]');
      if (button) { button.disabled = true; button.textContent = 'שולח…'; }
      const saved = await save(true, false);
      if (saved) renderThankYou();
      else if (button) { button.disabled = false; button.textContent = 'שליחת המשוב'; }
    }

    function renderThankYou() {
      app.className = '';
      app.innerHTML = `<main class="thank-you"><section class="thank-you-card">
        <img class="thank-you-logo" src="./logo.png" alt="תעשיידע">
        <div class="thank-you-icon">✓</div>
        <h1>תודה על המשוב</h1>
        <p>המשוב התקבל בהצלחה.</p>
      </section></main>`;
    }

    app.addEventListener('input', event => {
      const element = event.target;
      if (!(element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement)) return;
      updateFormFromElement(element);
      scheduleSave();
    });

    app.addEventListener('change', event => {
      const element = event.target;
      if (!(element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement)) return;
      updateFormFromElement(element);
      if (element.dataset.highlight || element.dataset.field === 'respondent_role') render();
      scheduleSave();
    });

    app.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'next') nextStep();
      if (action === 'back') {
        state.step = Math.max(0, state.step - 1);
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      if (action === 'submit') submitFeedback();
    });

    init();
  </script>
</body>
</html>
