<section class="card edit-form-card" id="edit-form-panel">
  <div class="dashboard-header-row">
    <div>
      <h2 class="card-title">בקשת עריכה</h2>
      <p class="card-subtitle">עדכון מבוקר בלבד, ללא שינוי נתון מקור.</p>
    </div>
    <a class="nav-link-button" href="?view=mycourses">חזרה לקורסים שלי</a>
  </div>

  <div class="status-stack">
    <div id="edit-form-loading" class="message">טוען את פרטי הרשומה...</div>
    <div id="edit-form-error" class="message message-error" style="display:none;"></div>
    <div id="edit-form-success" class="message message-success" style="display:none;"></div>
  </div>

  <div class="edit-sections">
    <section id="edit-form-summary" class="summary-box" style="display:none; margin-bottom: 12px;">
      <h3 class="section-title">פרטי רשומה</h3>
      <ul id="edit-form-summary-list" class="summary-list"></ul>
    </section>

    <form id="edit-request-form" class="form-grid" style="display:none; max-width:100%;">
      <div id="edit-form-fields" class="edit-fields-grid"></div>
      <div class="actions-row sticky-actions">
        <button type="submit">שמור בקשה</button>
        <a class="nav-link-button secondary-link" href="?view=mycourses">ביטול</a>
      </div>
    </form>
  </div>
</section>
