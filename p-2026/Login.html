<div class="login-layout">
  <section class="card login-card">
    <div class="login-header">
      <div class="login-kicker">כניסה מאובטחת</div>
      <h2 class="card-title">התחברות למערכת P-2026</h2>
      <p class="card-subtitle">יש להזין שם עובד/מספר עובד וקוד כניסה כפי שהוגדרו בגיליון ההרשאות.</p>
    </div>

    <form id="login-form" class="form-grid" novalidate>
      <div class="field">
        <label for="login-id">שם משתמש או מספר עובד</label>
        <input id="login-id" name="login-id" type="text" placeholder="למשל: 12345 או ישראל ישראלי" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="login-code">קוד כניסה</label>
        <input id="login-code" name="login-code" type="password" placeholder="הזן קוד כניסה" autocomplete="current-password" required>
      </div>

      <button id="login-btn" type="submit" aria-live="polite">התחבר</button>
      <div id="login-error" class="message message-error" style="display:none;"></div>
      <div id="login-success" class="message message-success" style="display:none;"></div>
    </form>
  </section>
</div>
