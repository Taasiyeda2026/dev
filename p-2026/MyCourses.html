<section class="card" id="mycourses-panel">
  <div class="mycourses-header">
    <div>
      <h2 class="card-title">הקורסים שלי</h2>
      <p class="card-subtitle">תצוגת קורסים אישית בפורמט קריא ומסודר.</p>
    </div>
    <div class="dashboard-tools">
      <button id="mycourses-refresh-btn" class="btn-secondary" type="button">רענון</button>
    </div>
  </div>

  <div class="toolbar-card">
    <div class="filters-row" aria-label="אזור חיפוש וסינון">
      <input id="mycourses-search" type="search" placeholder="חיפוש לפי קורס / מזהה / תוכנית">
      <select id="mycourses-program">
        <option value="">תוכנית: הכל</option>
      </select>
      <select id="mycourses-status">
        <option value="">סטטוס: הכל</option>
      </select>
    </div>
  </div>

  <div id="mycourses-loading" class="message" role="status" aria-live="polite">טוען נתוני קורסים...</div>
  <div id="mycourses-error" class="message message-error" style="display:none;"></div>
  <div id="mycourses-info" class="message" style="display:none;"></div>

  <div id="mycourses-table-wrapper" class="table-wrapper" aria-live="polite" style="display:none;">
    <table class="data-table" id="mycourses-table">
      <thead id="mycourses-head"></thead>
      <tbody id="mycourses-body"></tbody>
    </table>
  </div>

  <div id="mycourses-empty" class="empty-state" style="display:none; margin-top:12px;">אין נתונים להצגה כרגע.</div>
</section>
