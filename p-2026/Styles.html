<style>
  :root {
    --bg: #f4f7ff;
    --bg-layer: radial-gradient(circle at 15% -10%, rgba(76, 120, 255, 0.24) 0%, transparent 38%),
      radial-gradient(circle at 85% 0%, rgba(14, 165, 233, 0.18) 0%, transparent 36%),
      linear-gradient(180deg, #eef3ff 0%, #f8fbff 100%);
    --card: #ffffff;
    --card-soft: #f8fbff;
    --text: #0f172a;
    --muted: #5b6980;
    --primary: #1d4ed8;
    --primary-strong: #1e40af;
    --primary-soft: #e9f0ff;
    --success: #166534;
    --success-soft: #ecfdf3;
    --danger: #b42318;
    --danger-soft: #fff1f2;
    --warning: #9a6700;
    --warning-soft: #fff8eb;
    --info-soft: #eff6ff;
    --border: #d9e2ef;
    --border-strong: #c2d1e8;
    --shadow-sm: 0 6px 22px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 18px 48px rgba(15, 23, 42, 0.1);
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; direction: rtl; }

  body {
    font-family: "Heebo", "Rubik", "Segoe UI", Arial, sans-serif;
    background: var(--bg-layer);
    color: var(--text);
    line-height: 1.5;
  }

  h1, h2, h3, h4, p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }

  .app-shell { min-height: 100vh; display: flex; flex-direction: column; }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 30;
    padding: 18px 28px;
    border-bottom: 1px solid rgba(194, 209, 232, 0.75);
    background: linear-gradient(135deg, rgba(255,255,255,0.95) 20%, rgba(240,246,255,0.93) 100%);
    backdrop-filter: blur(12px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
  }

  .app-brand { display: grid; gap: 6px; }
  .app-kicker { font-size: 0.76rem; color: #355ba7; font-weight: 800; letter-spacing: 0.08em; }
  .app-header h1 { font-size: clamp(1.25rem, 2vw, 1.52rem); font-weight: 900; }
  .subtitle { color: var(--muted); font-size: 0.89rem; }

  .top-nav {
    width: min(1240px, 100% - 48px);
    margin: 16px auto 0;
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    background: rgba(255,255,255,0.74);
    border: 1px solid #dce6f4;
    border-radius: 999px;
    padding: 8px;
    box-shadow: 0 8px 26px rgba(76, 95, 130, 0.08);
  }

  .top-nav-link {
    text-decoration: none;
    color: #344459;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 0.87rem;
    font-weight: 700;
    transition: all .18s ease;
  }

  .top-nav-link:hover { border-color: #bed1f4; background: #eef4ff; color: #12326b; }
  .top-nav-link.is-active {
    color: #fff;
    border-color: #2347a0;
    background: linear-gradient(180deg, #2e62e8 0%, #214ebd 100%);
    box-shadow: 0 10px 20px rgba(34, 76, 185, 0.26);
  }

  .app-main { width: min(1240px, 100% - 48px); margin: 16px auto 34px; }

  .screen-header {
    margin-bottom: 16px;
    padding: 16px 18px;
    border-radius: var(--radius-lg);
    border: 1px solid #dbe5f4;
    background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(244,248,255,0.92) 100%);
    box-shadow: var(--shadow-sm);
  }

  .breadcrumbs { font-size: 0.82rem; color: #637892; margin-bottom: 4px; font-weight: 600; }
  .screen-title { font-size: clamp(1.3rem, 1.9vw, 1.56rem); font-weight: 900; }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn .22s ease-out; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-sm);
    padding: clamp(18px, 2.8vw, 30px);
  }

  .card-title { font-size: clamp(1.18rem, 1.45vw, 1.38rem); margin-bottom: 6px; font-weight: 850; }
  .card-subtitle, .muted { color: var(--muted); font-size: 0.92rem; }
  .small-text { font-size: 0.8rem; }

  .form-grid { display: grid; gap: 14px; }
  .field { display: grid; gap: 8px; }
  label, .field-label { font-size: 0.9rem; color: #34465d; font-weight: 700; }

  input, select, textarea {
    width: 100%;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    border: 1px solid #c8d5e8;
    background: #fff;
    font-size: 0.94rem;
    font-family: inherit;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input::placeholder, textarea::placeholder { color: #8b9ab0; }
  input:hover, select:hover, textarea:hover { border-color: #afc5ea; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #6d9cf0;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.16);
  }
  input:disabled, select:disabled, textarea:disabled {
    background: #f5f8fc;
    color: #73829a;
    border-color: #d9e3f2;
    cursor: not-allowed;
  }

  button, .btn {
    border: 0;
    border-radius: 11px;
    padding: 10px 16px;
    min-height: 42px;
    font-size: 0.93rem;
    font-weight: 800;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease, opacity .2s ease;
  }
  button:hover, .btn:hover { transform: translateY(-1px); }
  button:disabled, .btn:disabled { cursor: not-allowed; opacity: .74; transform: none; }

  button, .btn-primary {
    color: #fff;
    background: linear-gradient(180deg, #2a62ea 0%, var(--primary-strong) 100%);
    box-shadow: 0 12px 24px rgba(29, 64, 175, 0.26);
  }
  .btn-secondary, button.secondary { color: #1e293b; background: #e2e8f0; box-shadow: none; }
  .btn-secondary:hover, button.secondary:hover { background: #cbd5e1; }
  .btn-link {
    color: #1e40af;
    background: #eef4ff;
    border: 1px solid #bed2f6;
    box-shadow: none;
    text-decoration: none;
  }
  .btn-destructive { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); color: #fff; }

  .message {
    margin-top: 10px;
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    background: var(--info-soft);
    border: 1px solid #bfdbfe;
    color: #1e3a8a;
    font-size: 0.9rem;
    white-space: pre-wrap;
  }
  .message-error { background: var(--danger-soft); border-color: #fecaca; color: var(--danger); }
  .message-success { background: var(--success-soft); border-color: #bbf7d0; color: var(--success); }
  .message-warning { background: var(--warning-soft); border-color: #fdd58c; color: var(--warning); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 0.78rem;
    font-weight: 800;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .badge-pending { background: #fff7e6; color: #9a6700; border-color: #f9d694; }
  .badge-approved, .badge-applied { background: #ebfbf1; color: #166534; border-color: #b9ebcb; }
  .badge-rejected { background: #fff1f2; color: #b42318; border-color: #fecaca; }
  .badge-default { background: #f1f5f9; color: #334155; border-color: #dbe4ef; }

  .is-loading { position: relative; pointer-events: none; opacity: .84; }
  button.is-loading::after {
    content: '';
    width: 16px;
    height: 16px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.72);
    border-top-color: rgba(255,255,255,0.2);
    animation: spin .9s linear infinite;
    margin-right: 4px;
  }

  .panel-loading { position: relative; pointer-events: none; opacity: .84; }
  .panel-loading::after {
    content: '';
    position: absolute;
    left: 16px;
    top: 16px;
    width: 17px;
    height: 17px;
    border-radius: 999px;
    border: 2px solid #93c5fd;
    border-top-color: transparent;
    animation: spin .9s linear infinite;
  }

  .status-stack { display: grid; gap: 8px; margin-bottom: 10px; }
  .section-title { font-size: 1rem; font-weight: 800; margin-bottom: 10px; }

  .dashboard-header-row, .page-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid #e5edf8;
  }

  .dashboard-tools, .actions-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .kpi-grid {
    margin: 16px 0 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .kpi-card {
    border: 1px solid #d9e2f0;
    border-radius: 16px;
    padding: 14px;
    background: linear-gradient(160deg, #ffffff 0%, #f4f8ff 100%);
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.06);
  }
  .kpi-label { color: #455974; font-size: 0.84rem; font-weight: 700; }
  .kpi-value { font-size: clamp(1.4rem, 2vw, 1.9rem); font-weight: 900; margin-top: 8px; color: #0f172a; }

  .dashboard-sections { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .summary-box {
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 14px;
    background: #fff;
  }

  .summary-list li, .notes-list li {
    border-top: 1px dashed #e2e8f0;
    padding: 9px 0;
    font-size: 0.9rem;
    color: #1f2937;
  }
  .summary-list li:first-child, .notes-list li:first-child { border-top: 0; padding-top: 0; }

  .empty-state {
    border: 1px dashed #c2d2ea;
    background: #f7faff;
    border-radius: 12px;
    padding: 20px;
    color: #4a607d;
    text-align: center;
    font-size: 0.92rem;
  }

  .table-card, .table-wrapper {
    border: 1px solid #d6e0ef;
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .table-wrap { overflow: auto; max-height: 64vh; }
  .table-wrapper { overflow: auto; }

  table, .data-table { width: 100%; border-collapse: collapse; min-width: 780px; }
  .data-table { min-width: 1180px; }

  thead th, .data-table th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #f4f8ff;
    color: #2f425c;
    font-weight: 900;
    font-size: 0.82rem;
    border-bottom: 1px solid #d9e5f7;
    padding: 12px;
    text-align: right;
    white-space: nowrap;
  }
  tbody td, .data-table td {
    padding: 12px;
    border-bottom: 1px solid #eef2f7;
    font-size: 0.89rem;
    color: #1f2937;
    vertical-align: top;
  }
  tbody tr:hover, .data-table tbody tr:hover { background: #f8fbff; }
  .pending-row { background: #fffcf5; }

  .filters-row, .filters-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 0;
  }

  .toolbar-card {
    border: 1px solid #dde7f6;
    background: linear-gradient(180deg, #fbfdff 0%, #f3f8ff 100%);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .table-actions { display: flex; align-items: center; justify-content: flex-start; gap: 8px; flex-wrap: wrap; }

  .login-layout {
    min-height: calc(100vh - 278px);
    display: grid;
    align-items: center;
    justify-items: center;
    position: relative;
  }
  .login-layout::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius-xl);
    background: linear-gradient(130deg, rgba(37,99,235,0.09) 0%, rgba(14,165,233,0.06) 100%);
    pointer-events: none;
  }

  .login-card {
    width: min(560px, 100%);
    margin: 0 auto;
    box-shadow: var(--shadow-md);
    border: 1px solid #d4e0f4;
    z-index: 1;
    position: relative;
  }

  .login-header { margin-bottom: 16px; }
  .login-kicker { font-size: 0.78rem; font-weight: 800; color: #315cae; margin-bottom: 6px; }

  .user-pill {
    background: var(--primary-soft);
    color: #1e3a8a;
    border: 1px solid #bfdbfe;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 0.83rem;
    font-weight: 700;
  }

  .app-footer {
    width: min(1240px, 100% - 48px);
    margin: 0 auto 24px;
    padding: 12px 6px 0;
    border-top: 1px dashed #dbe3ef;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    color: #52627a;
    font-size: 0.83rem;
  }
  .runtime-ok { color: #106b45; font-weight: 800; }
  .runtime-warn { color: #a55308; font-weight: 800; }

  .nav-link-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border: 1px solid #bfd2f2;
    color: #1e3a8a;
    background: #eef4ff;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.88rem;
    font-weight: 800;
  }
  .nav-link-button:hover { background: #e3edff; }
  .secondary-link { border-color: #cbd5e1; color: #334155; background: #f8fafc; }

  .cell-wrap { white-space: pre-wrap; word-break: break-word; min-width: 110px; }
  .change-line {
    margin-bottom: 8px;
    background: #f8fbff;
    border: 1px solid #dbe8fb;
    border-radius: 10px;
    padding: 8px;
  }

  .approval-note { min-width: 190px; min-height: 68px; resize: vertical; }
  .approve-btn { background: linear-gradient(180deg, #16a34a 0%, #15803d 100%); box-shadow: 0 8px 18px rgba(21, 128, 61, 0.24); }
  .reject-btn { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 8px 18px rgba(185, 28, 28, 0.24); }

  .edit-sections {
    display: grid;
    gap: 12px;
  }

  .edit-fields-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .field-box {
    border: 1px solid #dfe8f6;
    border-radius: 12px;
    padding: 12px;
    background: #fff;
    display: grid;
    gap: 8px;
  }

  .field-readonly {
    border: 1px dashed #c9d7ec;
    border-radius: 10px;
    background: #f7faff;
    padding: 10px 12px;
    color: #334155;
    min-height: 42px;
  }

  .sticky-actions {
    position: sticky;
    bottom: 0;
    z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, #fff 35%);
    border-top: 1px solid #e2e8f0;
    padding-top: 12px;
    margin-top: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 980px) {
    .app-main, .top-nav { width: calc(100% - 20px); }
    .app-main { margin: 14px auto 22px; }
    .dashboard-sections, .filters-row, .filters-grid, .edit-fields-grid { grid-template-columns: 1fr; }
    .app-header { padding: 14px 12px; }
    .dashboard-header-row, .page-toolbar { flex-direction: column; }
    .top-nav { border-radius: 16px; }
    .top-nav-link { flex: 1 1 calc(50% - 9px); text-align: center; }
    .login-layout { min-height: auto; }
    .app-footer {
      width: calc(100% - 20px);
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 16px;
    }
  }
</style>
