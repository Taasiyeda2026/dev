<style>
  :root {
    --bg: #f3f6fb;
    --bg-accent: #e9eef8;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #1d4ed8;
    --primary-soft: #dbeafe;
    --danger: #b42318;
    --danger-soft: #fef3f2;
    --success: #15803d;
    --success-soft: #f0fdf4;
    --warning: #b45309;
    --warning-soft: #fff7ed;
    --border: #dbe3ef;
    --shadow-sm: 0 2px 10px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
    --radius-lg: 18px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    min-height: 100%;
    direction: rtl;
  }

  body {
    font-family: "Heebo", "Rubik", "Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(circle at 90% -20%, #e2ebff 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-accent) 0%, var(--bg) 100%);
    color: var(--text);
    line-height: 1.5;
  }

  h1, h2, h3, h4, p { margin: 0; }

  ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 3;
    padding: 18px 28px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(203, 213, 225, 0.8);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .app-header h1 {
    font-size: clamp(1.2rem, 2vw, 1.5rem);
    font-weight: 700;
  }

  .subtitle {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .top-nav {
    width: min(1180px, 100% - 48px);
    margin: 14px auto 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .top-nav-link {
    text-decoration: none;
    color: #334155;
    border: 1px solid #d7e1ef;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 999px;
    padding: 8px 13px;
    font-size: 0.88rem;
    font-weight: 500;
    transition: all .18s ease;
  }

  .top-nav-link:hover {
    border-color: #93c5fd;
    background: #eff6ff;
  }

  .top-nav-link.is-active {
    color: #1e3a8a;
    border-color: #bfdbfe;
    background: #eaf1ff;
  }

  .app-main {
    width: min(1180px, 100% - 48px);
    margin: 18px auto 36px;
  }

  .view { display: none; }

  .view.active {
    display: block;
    animation: fadeIn .22s ease-out;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: clamp(18px, 3vw, 28px);
  }

  .card-title { font-size: 1.35rem; margin-bottom: 8px; }

  .card-subtitle,
  .muted { color: var(--muted); font-size: 0.95rem; }

  .form-grid { display: grid; gap: 14px; }
  .field { display: grid; gap: 8px; }

  label { font-size: 0.92rem; color: #334155; font-weight: 500; }

  input,
  select,
  textarea {
    width: 100%;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    border: 1px solid #cbd5e1;
    background: #fff;
    font-size: 0.95rem;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  input::placeholder,
  textarea::placeholder { color: #94a3b8; }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.16);
  }

  button,
  .btn {
    border: 0;
    border-radius: 11px;
    padding: 10px 16px;
    min-height: 42px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease, opacity .2s ease;
  }

  button:hover,
  .btn:hover { transform: translateY(-1px); }

  button:disabled,
  .btn:disabled { cursor: not-allowed; opacity: .75; transform: none; }

  button,
  .btn-primary {
    color: #fff;
    background: linear-gradient(180deg, #2563eb 0%, var(--primary) 100%);
    box-shadow: 0 8px 18px rgba(29, 78, 216, 0.24);
  }

  button:focus-visible,
  .btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  .btn-secondary,
  button.secondary {
    color: #1e293b;
    background: #e2e8f0;
    box-shadow: none;
  }

  .btn-secondary:hover,
  button.secondary:hover { background: #cbd5e1; }

  .btn-link {
    color: #1e40af;
    background: transparent;
    border: 1px solid #bfdbfe;
    box-shadow: none;
  }

  .message {
    margin-top: 10px;
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e3a8a;
    font-size: 0.9rem;
    white-space: pre-wrap;
  }

  .message-error {
    background: var(--danger-soft);
    border-color: #fecaca;
    color: var(--danger);
  }

  .message-success {
    background: var(--success-soft);
    border-color: #bbf7d0;
    color: var(--success);
  }

  .message-warning {
    background: var(--warning-soft);
    border-color: #fed7aa;
    color: var(--warning);
  }

  .is-loading {
    position: relative;
    pointer-events: none;
    opacity: .82;
  }

  button.is-loading::after {
    content: '';
    width: 16px;
    height: 16px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.72);
    border-top-color: rgba(255,255,255,0.22);
    animation: spin .9s linear infinite;
    margin-right: 4px;
  }

  .panel-loading {
    position: relative;
    pointer-events: none;
    opacity: .86;
  }

  .panel-loading::after {
    content: '';
    position: absolute;
    left: 16px;
    top: 16px;
    width: 17px;
    height: 17px;
    border-radius: 999px;
    border: 2px solid #93c5fd;
    border-top-color: transparent;
    animation: spin .9s linear infinite;
  }

  .dashboard-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid #e8edf5;
  }

  .dashboard-tools { display: flex; gap: 8px; flex-wrap: wrap; }

  .kpi-grid {
    margin: 18px 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
    gap: 12px;
  }

  .kpi-card {
    border: 1px solid #d9e2f0;
    border-radius: 14px;
    padding: 14px;
    background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
  }

  .kpi-label { color: #475569; font-size: 0.85rem; font-weight: 500; }
  .kpi-value { font-size: clamp(1.3rem, 2vw, 1.7rem); font-weight: 700; margin-top: 8px; color: #0f172a; }

  .summary-grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .summary-box {
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 14px;
    background: #fff;
  }

  .summary-box h3 { margin-bottom: 10px; font-size: 1.02rem; }

  .summary-list li,
  .notes-list li {
    border-top: 1px dashed #e2e8f0;
    padding: 9px 0;
    font-size: 0.92rem;
    color: #1f2937;
  }

  .summary-list li:first-child,
  .notes-list li:first-child { border-top: 0; padding-top: 0; }

  .empty-state {
    border: 1px dashed #cbd5e1;
    background: #f8fafc;
    border-radius: 12px;
    padding: 16px;
    color: #475569;
    text-align: center;
    font-size: 0.92rem;
  }

  .table-card {
    border: 1px solid #d8e0ed;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
  }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 720px;
  }

  thead th {
    background: #f8fafc;
    color: #334155;
    font-weight: 700;
    font-size: 0.88rem;
    border-bottom: 1px solid #e2e8f0;
    padding: 12px;
    text-align: right;
  }

  tbody td {
    padding: 11px 12px;
    border-bottom: 1px solid #eef2f7;
    font-size: 0.92rem;
    color: #1f2937;
  }

  tbody tr:hover { background: #f8fbff; }

  .filters-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .table-actions {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
  }

  .login-layout {
    min-height: calc(100vh - 240px);
    display: grid;
    align-items: center;
  }

  .login-card {
    width: min(460px, 100%);
    margin: 0 auto;
    box-shadow: var(--shadow-md);
  }

  .login-header { margin-bottom: 16px; }

  .mycourses-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .user-pill {
    background: var(--primary-soft);
    color: #1e3a8a;
    border: 1px solid #bfdbfe;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 0.83rem;
    font-weight: 500;
  }

  .helper-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 900px) {
    .app-main,
    .top-nav {
      width: calc(100% - 24px);
    }

    .app-main { margin: 16px auto 26px; }

    .summary-grid,
    .filters-row { grid-template-columns: 1fr; }

    .app-header { padding: 14px 16px; }
  }
</style>
