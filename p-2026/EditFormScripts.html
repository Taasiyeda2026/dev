<script>
  (function () {
    if (!window.APP_BOOT || window.APP_BOOT.currentView !== 'edit-form') return;

    var state = {
      sourceRowNumber: null,
      fields: []
    };

    hydrateUserPill(window.APP_BOOT.userProfile);
    bindForm();
    loadForm();

    function bindForm() {
      var form = document.getElementById('edit-request-form');
      if (!form) return;

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        submitRequest();
      });
    }

    function loadForm() {
      var row = getQueryParam('row');
      if (!row) {
        setError('לא נבחרה רשומה לעריכה. יש לחזור למסך הקורסים.');
        showLoading(false);
        return;
      }

      google.script.run
        .withSuccessHandler(function (result) {
          showLoading(false);
          if (!result || !result.success || !result.data) {
            setError(formatServerError(result && (result.error || result.message || result), 'טעינת טופס העריכה נכשלה.'));
            return;
          }

          state.sourceRowNumber = result.data.sourceRowNumber;
          state.fields = result.data.fields || [];

          renderSummary(result.data.recordSummary || {});
          renderFields(state.fields);
          showForm(true);
          setInfoFromAssumptions(result.data.assumptions || []);
        })
        .withFailureHandler(function (err) {
          showLoading(false);
          setError(formatServerError(err, 'אירעה שגיאה בטעינת טופס העריכה.'));
        })
        .getEditFormDataAction(row);
    }

    function submitRequest() {
      clearMessages();

      var updates = {};
      state.fields.forEach(function (field) {
        if (!field.editable) return;
        var input = document.getElementById('field-' + field.key);
        if (!input) return;
        updates[field.requestKey] = input.value;
      });

      google.script.run
        .withSuccessHandler(function (result) {
          if (!result || !result.success) {
            setError(formatServerError(result && (result.error || result.message || result), 'שמירת הבקשה נכשלה.'));
            return;
          }
          setSuccess(result.message || 'הבקשה נשמרה בהצלחה.');
        })
        .withFailureHandler(function (err) {
          setError(formatServerError(err, 'אירעה שגיאה בשמירת הבקשה.'));
        })
        .submitEditRequestAction({
          sourceRowNumber: state.sourceRowNumber,
          updates: updates
        });
    }

    function renderSummary(summary) {
      var block = document.getElementById('edit-form-summary');
      var list = document.getElementById('edit-form-summary-list');
      if (!block || !list) return;

      var rows = [
        'שורת מקור: ' + (summary.rowNumber || ''),
        'קורס: ' + (summary.courseId || '-'),
        'תוכנית: ' + (summary.program || '-'),
        'סטטוס נוכחי: ' + (summary.status || '-')
      ];

      list.innerHTML = rows.map(function (row) { return '<li>' + escapeHtml(row) + '</li>'; }).join('');
      block.style.display = 'block';
    }

    function renderFields(fields) {
      var container = document.getElementById('edit-form-fields');
      if (!container) return;

      container.innerHTML = fields.map(function (field) {
        var value = field.value === null || field.value === undefined ? '' : String(field.value);
        var control = field.editable
          ? '<input id="field-' + escapeHtml(field.key) + '" type="text" value="' + escapeHtml(value) + '" />'
          : '<div class="field-readonly">' + escapeHtml(value || '-') + '</div>';

        var note = field.editable ? '' : '<div class="muted small-text">' + escapeHtml(field.lockedReason || 'קריאה בלבד') + '</div>';

        return '' +
          '<div class="field-box">' +
            '<label class="field-label">' + escapeHtml(field.label || field.key) + '</label>' +
            control +
            note +
          '</div>';
      }).join('');
    }

    function setInfoFromAssumptions(assumptions) {
      if (!assumptions.length) return;
      setError(assumptions.join(' | '));
    }

    function showLoading(flag) {
      var el = document.getElementById('edit-form-loading');
      if (!el) return;
      el.style.display = flag ? 'block' : 'none';
    }

    function showForm(flag) {
      var form = document.getElementById('edit-request-form');
      if (!form) return;
      form.style.display = flag ? 'block' : 'none';
    }

    function clearMessages() {
      setError('');
      setSuccess('');
    }

    function setError(msg) {
      var el = document.getElementById('edit-form-error');
      if (!el) return;
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg || '';
    }

    function setSuccess(msg) {
      var el = document.getElementById('edit-form-success');
      if (!el) return;
      el.style.display = msg ? 'block' : 'none';
      el.textContent = msg || '';
    }

    function getQueryParam(name) {
      var params = new URLSearchParams(window.location.search || '');
      return params.get(name);
    }

    function hydrateUserPill(userProfile) {
      var pill = document.getElementById('user-pill');
      if (!pill || !userProfile) return;
      pill.style.display = 'inline-block';
      pill.textContent = 'מחובר/ת: ' + (userProfile.EmployeeName || userProfile.EmployeeID || 'משתמש');
    }

    function formatServerError(err, fallback) {
      if (!err) return fallback;
      if (typeof err === 'string') return err;
      if (err && err.message) return err.message;
      try {
        return JSON.stringify(err, null, 2);
      } catch (jsonErr) {
        return fallback;
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  })();
</script>
