<section class="card dashboard-card">
  <div class="dashboard-header-row">
    <div>
      <h2 class="card-title">דשבורד ניהולי</h2>
      <p class="card-subtitle">תצוגת מצב מערכת בזמן אמת (קריאה בלבד).</p>
    </div>
    <div class="dashboard-tools">
      <a class="nav-link-button" href="?view=mycourses">הקורסים שלי</a>
      <a class="nav-link-button" href="?view=myrequests">הבקשות שלי</a>
      <a class="nav-link-button" href="?view=approvals">אישורים</a>
      <button id="logout-btn" class="secondary">התנתקות</button>
    </div>
  </div>

  <div class="status-stack">
    <div id="dashboard-loading" class="message" role="status" aria-live="polite">טוען נתוני דשבורד...</div>
    <div id="dashboard-error" class="message message-error" style="display:none;"></div>
  </div>

  <div id="kpi-grid" class="kpi-grid"></div>

  <div class="dashboard-sections">
    <section class="summary-box">
      <h3 class="section-title">סיכום כללי</h3>
      <ul id="summary-list" class="summary-list"></ul>
    </section>

    <section class="summary-box">
      <h3 class="section-title">הערות מערכת ושדות חסרים</h3>
      <ul id="assumptions-list" class="notes-list"></ul>
      <ul id="missing-fields-list" class="notes-list"></ul>
    </section>
  </div>
</section>
