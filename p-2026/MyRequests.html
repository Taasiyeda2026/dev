<section class="card my-requests-card" id="my-requests-panel">
  <div class="dashboard-header-row">
    <div>
      <h2 class="card-title">הבקשות שלי</h2>
      <p class="card-subtitle">תצוגת בקשות מתוך EDIT_REQUESTS בלבד (קריאה בלבד).</p>
    </div>
    <div class="actions-row">
      <a class="nav-link-button" href="?view=dashboard">חזרה לדשבורד</a>
      <a class="nav-link-button secondary-link" href="?view=mycourses">הקורסים שלי</a>
      <button id="my-requests-refresh-btn" type="button" class="secondary">רענון</button>
    </div>
  </div>

  <div class="toolbar-card">
    <div class="filters-grid my-requests-filters">
      <input id="requests-search" type="text" placeholder="חיפוש בבקשות..." />
      <select id="requests-status-filter"><option value="">כל הסטטוסים</option></select>
      <select id="requests-type-filter"><option value="">כל סוגי הבקשה</option></select>
    </div>
  </div>

  <div class="status-stack">
    <div id="my-requests-loading" class="message">טוען בקשות...</div>
    <div id="my-requests-error" class="message message-error" style="display:none;"></div>
    <div id="my-requests-info" class="message" style="display:none;"></div>
  </div>

  <div class="table-wrapper">
    <table class="data-table" id="my-requests-table" style="display:none;">
      <thead id="my-requests-head"></thead>
      <tbody id="my-requests-body"></tbody>
    </table>
  </div>

  <div id="my-requests-empty" class="empty-state" style="display:none; margin-top: 12px;">לא נמצאו בקשות להצגה.</div>
</section>
