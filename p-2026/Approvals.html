<section class="card approvals-card" id="approvals-panel">
  <div class="dashboard-header-row">
    <div>
      <h2 class="card-title">אישורים</h2>
      <p class="card-subtitle">ניהול בקשות ממתינות ואישור/דחייה במסלול מבוקר.</p>
    </div>
    <div class="actions-row">
      <a class="nav-link-button" href="?view=dashboard">חזרה לדשבורד</a>
      <a class="nav-link-button secondary-link" href="?view=myrequests">הבקשות שלי</a>
      <button id="approvals-refresh-btn" type="button" class="secondary">רענון</button>
    </div>
  </div>

  <div class="toolbar-card">
    <div class="filters-grid approvals-filters">
      <input id="approvals-search" type="text" placeholder="חיפוש בבקשות..." />
      <select id="approvals-status-filter">
        <option value="">כל הסטטוסים</option>
      </select>
      <select id="approvals-type-filter">
        <option value="">כל סוגי הבקשה</option>
      </select>
    </div>
  </div>

  <div class="status-stack">
    <div id="approvals-loading" class="message">טוען בקשות לאישור...</div>
    <div id="approvals-error" class="message message-error" style="display:none;"></div>
    <div id="approvals-info" class="message" style="display:none;"></div>
  </div>

  <div class="table-wrapper">
    <table class="data-table" id="approvals-table" style="display:none;">
      <thead>
        <tr>
          <th>מס' בקשה</th>
          <th>סוג בקשה</th>
          <th>מבקש</th>
          <th>תאריך יצירה</th>
          <th>סטטוס</th>
          <th>שורת מקור</th>
          <th>תוכנית / קורס</th>
          <th>תקציר שינויים</th>
          <th>השוואת נתונים</th>
          <th>הערת מערכת</th>
          <th>הערת מאשר</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="approvals-body"></tbody>
    </table>
  </div>

  <div id="approvals-empty" class="empty-state" style="display:none; margin-top: 12px;">אין כרגע בקשות להצגה במסך האישורים.</div>
</section>
