<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><?= pageTitle ?></title>
    <?!= include('Styles'); ?>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1>מערכת ניהול ארצית</h1>
          <p class="subtitle">מערכת ניהול והצגת נתונים · Google Apps Script + Google Sheets</p>
        </div>
        <div id="user-pill" class="user-pill" style="display:none;"></div>
      </header>

      <nav class="top-nav" aria-label="ניווט ראשי">
        <a class="top-nav-link <?!= currentView === 'dashboard' ? 'is-active' : ''; ?>" href="?view=dashboard">דשבורד</a>
        <a class="top-nav-link <?!= currentView === 'mycourses' ? 'is-active' : ''; ?>" href="?view=mycourses">הקורסים שלי</a>
        <a class="top-nav-link <?!= currentView === 'myrequests' ? 'is-active' : ''; ?>" href="?view=myrequests">הבקשות שלי</a>
        <a class="top-nav-link <?!= currentView === 'approvals' ? 'is-active' : ''; ?>" href="?view=approvals">אישורים</a>
        <a class="top-nav-link <?!= currentView === 'login' ? 'is-active' : ''; ?>" href="?view=login">התחברות</a>
      </nav>

      <main class="app-main">
        <div class="screen-header">
          <div class="breadcrumbs">דף הבית / <?= currentView === 'dashboard' ? 'דשבורד' : currentView === 'mycourses' ? 'הקורסים שלי' : currentView === 'edit-form' ? 'בקשת עריכה' : currentView === 'myrequests' ? 'הבקשות שלי' : currentView === 'approvals' ? 'אישורים' : 'התחברות' ?></div>
          <h2 class="screen-title"><?= currentView === 'dashboard' ? 'דשבורד ניהולי' : currentView === 'mycourses' ? 'הקורסים שלי' : currentView === 'edit-form' ? 'בקשת עריכה' : currentView === 'myrequests' ? 'הבקשות שלי' : currentView === 'approvals' ? 'ניהול אישורים' : 'התחברות למערכת' ?></h2>
        </div>

        <section id="view-login" class="view <?!= currentView === 'login' ? 'active' : ''; ?>">
          <?!= include('Login'); ?>
        </section>

        <section id="view-dashboard" class="view <?!= currentView === 'dashboard' ? 'active' : ''; ?>">
          <?!= include('Dashboard'); ?>
        </section>

        <section id="view-mycourses" class="view <?!= currentView === 'mycourses' ? 'active' : ''; ?>">
          <?!= include('MyCourses'); ?>
        </section>

        <section id="view-edit-form" class="view <?!= currentView === 'edit-form' ? 'active' : ''; ?>">
          <?!= include('EditForm'); ?>
        </section>

        <section id="view-myrequests" class="view <?!= currentView === 'myrequests' ? 'active' : ''; ?>">
          <?!= include('MyRequests'); ?>
        </section>

        <section id="view-approvals" class="view <?!= currentView === 'approvals' ? 'active' : ''; ?>">
          <?!= include('Approvals'); ?>
        </section>
      </main>
    </div>

    <script>
      window.APP_BOOT = {
        currentView: '<?= currentView ?>',
        userProfile: <?!= JSON.stringify(userProfile || null); ?>
      };
    </script>

    <?!= include('LoginScripts'); ?>
    <?!= include('DashboardScripts'); ?>
    <?!= include('MyCoursesScripts'); ?>
    <?!= include('EditFormScripts'); ?>
    <?!= include('MyRequestsScripts'); ?>
    <?!= include('ApprovalsScripts'); ?>
  </body>
</html>
